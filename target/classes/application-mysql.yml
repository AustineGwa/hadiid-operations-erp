# Real deployment profile — MySQL + Flyway. Activate with SPRING_PROFILES_ACTIVE=mysql
# (or set spring.profiles.active=mysql in application.yml / an environment variable).
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hadiid_erp}?useSSL=false&serverTimezone=Africa/Nairobi&allowPublicKeyRetrieval=true
    username: ${DB_USER:hadiid_app}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
