<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title=${customer.name})}"></head>
<body class="bg-slate-50 min-h-screen">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div class="lg:pl-64">
<div th:replace="~{fragments/layout :: topbar(title=${customer.name})}"></div>
<main class="max-w-3xl mx-auto p-6">
    <h1 class="text-2xl font-bold text-slate-900 mb-4" th:text="${customer.name}"></h1>
    <div class="card p-5 grid grid-cols-2 gap-3 text-sm">
        <div><span class="text-slate-500">Registration No.:</span> <span th:text="${customer.registrationNo} ?: '-'"></span></div>
        <div><span class="text-slate-500">Phone:</span> <span th:text="${customer.phone} ?: '-'"></span></div>
        <div class="col-span-2"><span class="text-slate-500">Address:</span> <span th:text="${customer.address} ?: '-'"></span></div>
        <div><span class="text-slate-500">Jobs:</span> <span th:text="${customer.jobCount}"></span></div>
    </div>
    <a href="/customers" class="inline-block mt-4 text-sm underline text-slate-600">Back to customers</a>
</main>
</div>
</body>
</html>
