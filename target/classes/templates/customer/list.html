<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Customers')}"></head>
<body class="bg-slate-50 min-h-screen">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div class="lg:pl-64">
<div th:replace="~{fragments/layout :: topbar(title='Customers')}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="max-w-5xl mx-auto p-6">
    <h1 class="text-2xl font-bold text-slate-900 mb-4">Customers</h1>

    <form method="get" th:action="@{/customers}" class="mb-4">
        <input type="text" name="q" th:value="${q}" placeholder="Search name, registration no., phone"
               class="input !w-80"/>
        <button type="submit" class="btn-secondary">Search</button>
    </form>

    <div class="card overflow-hidden">
        <table class="min-w-full text-sm">
            <thead class="bg-slate-50">
            <tr>
                <th class="th-cell">Name</th>
                <th class="th-cell">Registration No.</th>
                <th class="th-cell">Phone</th>
                <th class="th-cell text-right">Jobs</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${result.items}" class="border-t hover:bg-slate-50 cursor-pointer"
                th:onclick="'window.location=\'/customers/' + ${c.id} + '\''">
                <td class="td-cell font-medium" th:text="${c.name}"></td>
                <td class="td-cell" th:text="${c.registrationNo}"></td>
                <td class="td-cell" th:text="${c.phone}"></td>
                <td class="td-cell text-right" th:text="${c.jobCount}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(result.items)}">
                <td colspan="4" class="px-4 py-6 text-center text-slate-400">No customers found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</div>
</body>
</html>
