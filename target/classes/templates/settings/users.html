<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(title='Users')}"></head>
<body class="bg-slate-50 min-h-screen">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div class="lg:pl-64">
<div th:replace="~{fragments/layout :: topbar(title='Users')}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="max-w-5xl mx-auto p-6">
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-bold text-slate-900">Users</h1>
        <a sec:authorize="hasAuthority('USER_CREATE')" href="/settings/users/new"
           class="btn-primary">+ New User</a>
    </div>

    <div class="card overflow-hidden">
        <table class="min-w-full text-sm">
            <thead class="bg-slate-50">
            <tr>
                <th class="th-cell">Full Name</th>
                <th class="th-cell">Username</th>
                <th class="th-cell">Role</th>
                <th class="th-cell">Team</th>
                <th class="th-cell">Status</th>
                <th class="th-cell" sec:authorize="hasAuthority('USER_DISABLE')">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}" class="border-t">
                <td class="td-cell font-medium" th:text="${u.fullName}"></td>
                <td class="td-cell" th:text="${u.username}"></td>
                <td class="td-cell" th:text="${u.roleLabel}"></td>
                <td class="td-cell" th:text="${u.team}"></td>
                <td class="td-cell">
                    <span th:text="${u.status}" th:class="${u.status == 'ACTIVE'} ? 'text-green-700' : 'text-red-700'"></span>
                </td>
                <td class="td-cell" sec:authorize="hasAuthority('USER_DISABLE')">
                    <form th:if="${u.status == 'ACTIVE'}" method="post" th:action="@{/settings/users/{id}/disable(id=${u.id})}">
                        <button type="submit" class="text-red-600 underline text-xs">Disable</button>
                    </form>
                    <form th:if="${u.status != 'ACTIVE'}" method="post" th:action="@{/settings/users/{id}/enable(id=${u.id})}">
                        <button type="submit" class="text-green-700 underline text-xs">Enable</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</div>
</body>
</html>
