<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(title='Reference data')}"></head>
<body class="bg-slate-50 min-h-screen">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div class="lg:pl-64">
<div th:replace="~{fragments/layout :: topbar(title='Reference Data')}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="max-w-5xl mx-auto p-6 space-y-6">
    <h1 class="text-2xl font-bold text-slate-900">Reference / Master Data</h1>
    <p class="text-sm text-slate-500">Configurable without code changes (Rule 8/18). Also see <a href="/settings/calendar" class="underline">Production Calendar</a>.</p>

    <div class="card overflow-hidden">
        <div class="px-4 py-2 bg-slate-50 font-semibold text-slate-800 border-b border-slate-100">Body Types</div>
        <table class="min-w-full text-sm">
            <thead class="text-left border-b text-slate-600">
            <tr><th class="th-cell">Section</th><th class="th-cell">Code</th><th class="th-cell">Label</th><th class="th-cell">Active</th><th class="th-cell"></th></tr>
            </thead>
            <tbody>
            <tr th:each="b : ${bodyTypes}" class="border-t">
                <td class="td-cell" th:text="${b.sectionCode}"></td>
                <td class="td-cell" th:text="${b.code}"></td>
                <td class="td-cell" th:text="${b.label}"></td>
                <td class="td-cell" th:text="${b.active} ? 'Yes' : 'No'"></td>
                <td class="td-cell" sec:authorize="hasAuthority('SETTINGS_EDIT')">
                    <form method="post" th:action="@{/settings/reference/body-types/{id}/toggle(id=${b.id})}">
                        <input type="hidden" name="active" th:value="${!b.active}"/>
                        <button type="submit" class="text-xs underline" th:text="${b.active} ? 'Disable' : 'Enable'"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <form method="post" th:action="@{/settings/reference/body-types}" sec:authorize="hasAuthority('SETTINGS_EDIT')"
              class="p-4 border-t flex flex-wrap gap-2 text-sm">
            <select name="sectionId" class="input !py-1.5">
                <option th:each="s : ${sections}" th:value="${s.id}" th:text="${s.label}"></option>
            </select>
            <input type="text" name="code" placeholder="CODE" required class="input !py-1.5"/>
            <input type="text" name="label" placeholder="Label" required class="input !py-1.5"/>
            <button type="submit" class="btn-primary !px-3 !py-1.5">Add Body Type</button>
        </form>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
        <div class="card overflow-hidden">
            <div class="px-4 py-2 bg-slate-50 font-semibold text-slate-800 border-b border-slate-100">Fabrication Stages</div>
            <table class="min-w-full text-sm">
                <thead class="text-left border-b text-slate-600"><tr><th class="th-cell">#</th><th class="th-cell">Code</th><th class="th-cell">Label</th></tr></thead>
                <tbody>
                <tr th:each="s : ${stages}" class="border-t">
                    <td class="td-cell" th:text="${s.sequenceOrder}"></td>
                    <td class="td-cell" th:text="${s.code}"></td>
                    <td class="td-cell" th:text="${s.label}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card overflow-hidden">
            <div class="px-4 py-2 bg-slate-50 font-semibold text-slate-800 border-b border-slate-100">Payment Methods</div>
            <table class="min-w-full text-sm">
                <thead class="text-left border-b text-slate-600"><tr><th class="th-cell">Code</th><th class="th-cell">Label</th></tr></thead>
                <tbody>
                <tr th:each="m : ${paymentMethods}" class="border-t">
                    <td class="td-cell" th:text="${m.code}"></td>
                    <td class="td-cell" th:text="${m.label}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</div>
</body>
</html>
