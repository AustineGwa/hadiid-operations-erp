<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Edit job')}"></head>
<body class="bg-slate-50 min-h-screen">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div class="lg:pl-64">
<div th:replace="~{fragments/layout :: topbar(title='Edit Job')}"></div>
<main class="max-w-3xl mx-auto p-6">
    <h1 class="text-2xl font-bold text-slate-900 mb-6">Edit Job</h1>

    <form method="post" th:action="@{/jobs/{id}/edit(id=${jobId})}" th:object="${job}" class="card p-6 grid md:grid-cols-2 gap-4 text-sm">
        <div>
            <label class="block text-xs text-slate-500 mb-1">Body Type</label>
            <select th:field="*{bodyTypeId}" required class="input">
                <option th:each="b : ${bodyTypes}" th:value="${b.id}" th:text="${b.label}"></option>
            </select>
        </div>
        <div>
            <label class="block text-xs text-slate-500 mb-1">Vehicle Model</label>
            <input type="text" th:field="*{vehicleModel}" required class="input"/>
        </div>
        <div>
            <label class="block text-xs text-slate-500 mb-1">Planned Start Date</label>
            <input type="date" th:field="*{plannedStartDate}" required class="input"/>
        </div>
        <div></div>
        <div>
            <label class="block text-xs text-slate-500 mb-1">Planned Production Days</label>
            <input type="number" th:field="*{plannedProductionDays}" required min="1" class="input"/>
        </div>
        <div>
            <label class="block text-xs text-slate-500 mb-1">Planned Finishing Days</label>
            <input type="number" th:field="*{plannedFinishingDays}" required min="1" class="input"/>
        </div>
        <div>
            <label class="block text-xs text-slate-500 mb-1">Contract Amount</label>
            <input type="number" step="0.01" th:field="*{contractAmount}" class="input"/>
        </div>
        <div></div>
        <div class="md:col-span-2 border-t pt-4 mt-2">
            <h3 class="font-semibold text-slate-700 mb-2">Customer (name/phone/address only — see Customers for full record)</h3>
        </div>
        <div>
            <label class="block text-xs text-slate-500 mb-1">Customer Name</label>
            <input type="text" th:field="*{customerName}" class="input"/>
        </div>
        <div>
            <label class="block text-xs text-slate-500 mb-1">Phone</label>
            <input type="text" th:field="*{customerPhone}" class="input"/>
        </div>
        <div class="md:col-span-2">
            <label class="block text-xs text-slate-500 mb-1">Address</label>
            <input type="text" th:field="*{customerAddress}" class="input"/>
        </div>
        <div class="md:col-span-2">
            <label class="block text-xs text-slate-500 mb-1">Notes</label>
            <textarea th:field="*{notes}" rows="3" class="input"></textarea>
        </div>
        <div class="md:col-span-2 flex gap-3 mt-2">
            <button type="submit" class="btn-primary">Save Changes</button>
            <a th:href="@{/jobs/{id}(id=${jobId})}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</main>
</div>
</body>
</html>
