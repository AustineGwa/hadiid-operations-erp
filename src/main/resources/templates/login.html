<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Sign in')}"></head>
<body class="bg-gradient-to-br from-brand-950 via-brand-900 to-brand-700 min-h-screen flex items-center justify-center px-4">
<div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-6">
        <div class="w-12 h-12 rounded-xl bg-white text-brand-700 flex items-center justify-center font-bold text-xl shadow-lg mb-3">H</div>
        <h1 class="text-white text-xl font-bold">Hadiid ERP</h1>
        <p class="text-brand-200 text-sm">Vehicle Fabrication Tracker</p>
    </div>

    <div class="card p-8">
        <div th:if="${param.error}" class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">
            Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-lg px-3 py-2 mb-4">
            You have been signed out.
        </div>

        <form method="post" th:action="@{/login}" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                <input type="text" name="username" required autofocus class="input"/>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <div class="relative">
                    <input type="password" name="password" required id="password-field" class="input pr-10"/>
                    <button type="button" onclick="togglePasswordVisibility('password-field', this)"
                            class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-slate-600"
                            aria-label="Show password" tabindex="-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 eye-open" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 eye-closed hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary w-full justify-center !py-2.5">Sign in</button>
        </form>
    </div>
</div>
</body>
</html>
