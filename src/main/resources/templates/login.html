<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Sign in')}"></head>
<body class="bg-gradient-to-br from-brand-950 via-brand-900 to-brand-700 min-h-screen flex items-center justify-center px-4">
<div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-6">
        <div class="w-12 h-12 rounded-xl bg-white text-brand-700 flex items-center justify-center font-bold text-xl shadow-lg mb-3">H</div>
        <h1 class="text-white text-xl font-bold">Hadiid ERP</h1>
        <p class="text-brand-200 text-sm">Vehicle Fabrication Tracker</p>
    </div>

    <div class="card p-8">
        <div th:if="${param.error}" class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">
            Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-lg px-3 py-2 mb-4">
            You have been signed out.
        </div>

        <form method="post" th:action="@{/login}" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                <input type="text" name="username" required autofocus class="input"/>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required class="input"/>
            </div>
            <button type="submit" class="btn-primary w-full justify-center !py-2.5">Sign in</button>
        </form>
    </div>
</div>
</body>
</html>
