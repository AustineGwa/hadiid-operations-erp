<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(title='Workers & contractors')}"></head>
<body class="bg-slate-50 min-h-screen">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div class="lg:pl-64">
<div th:replace="~{fragments/layout :: topbar(title='Workers &amp; Contractors')}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="max-w-5xl mx-auto p-6 space-y-6">
    <h1 class="text-2xl font-bold text-slate-900">Workers &amp; Contractors</h1>
    <p class="text-sm text-slate-500">Assign workers to jobs and record payments from a job's Labor &amp; Payments tab.</p>

    <div class="grid md:grid-cols-2 gap-6">
        <div class="card overflow-hidden">
            <div class="px-4 py-2 bg-slate-50 font-semibold text-slate-800 border-b border-slate-100">Workers</div>
            <table class="min-w-full text-sm">
                <thead class="text-left border-b text-slate-600"><tr><th class="th-cell">Name</th><th class="th-cell">ID No.</th><th class="th-cell">Contractor</th></tr></thead>
                <tbody>
                <tr th:each="w : ${workers}" class="border-t">
                    <td class="td-cell" th:text="${w.name}"></td>
                    <td class="td-cell" th:text="${w.idNumber}"></td>
                    <td class="td-cell" th:text="${w.contractorName} ?: '-'"></td>
                </tr>
                </tbody>
            </table>
            <form method="post" th:action="@{/labor/workers}" sec:authorize="hasAuthority('SETTINGS_EDIT')"
                  class="p-4 border-t flex flex-wrap gap-2 text-sm">
                <input type="text" name="name" placeholder="Name" required class="input !py-1.5"/>
                <input type="text" name="idNumber" placeholder="ID Number" class="input !py-1.5"/>
                <input type="text" name="phone" placeholder="Phone" class="input !py-1.5"/>
                <select name="contractorId" class="input !py-1.5">
                    <option value="">(no contractor)</option>
                    <option th:each="c : ${contractors}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
                <button type="submit" class="btn-primary !px-3 !py-1.5">Add Worker</button>
            </form>
        </div>

        <div class="card overflow-hidden">
            <div class="px-4 py-2 bg-slate-50 font-semibold text-slate-800 border-b border-slate-100">Contractors</div>
            <table class="min-w-full text-sm">
                <thead class="text-left border-b text-slate-600"><tr><th class="th-cell">Name</th><th class="th-cell">Reg. No.</th><th class="th-cell">Phone</th></tr></thead>
                <tbody>
                <tr th:each="c : ${contractors}" class="border-t">
                    <td class="td-cell" th:text="${c.name}"></td>
                    <td class="td-cell" th:text="${c.registrationNo}"></td>
                    <td class="td-cell" th:text="${c.phone}"></td>
                </tr>
                </tbody>
            </table>
            <form method="post" th:action="@{/labor/contractors}" sec:authorize="hasAuthority('SETTINGS_EDIT')"
                  class="p-4 border-t flex flex-wrap gap-2 text-sm">
                <input type="text" name="name" placeholder="Name" required class="input !py-1.5"/>
                <input type="text" name="registrationNo" placeholder="Registration No." class="input !py-1.5"/>
                <input type="text" name="phone" placeholder="Phone" class="input !py-1.5"/>
                <button type="submit" class="btn-primary !px-3 !py-1.5">Add Contractor</button>
            </form>
        </div>
    </div>
</main>
</div>
</body>
</html>
