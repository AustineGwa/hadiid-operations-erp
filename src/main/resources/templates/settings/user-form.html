<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='New user')}"></head>
<body class="bg-slate-50 min-h-screen">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div class="lg:pl-64">
    <div th:replace="~{fragments/layout :: topbar(title='New User')}"></div>
    <main class="max-w-lg mx-auto p-6">
        <h1 class="text-2xl font-bold text-slate-900 mb-6">New User</h1>
        <form method="post" th:action="@{/settings/users}" th:object="${user}" class="card p-6 space-y-4 text-sm">
            <div>
                <label class="block text-xs text-slate-500 mb-1">Username</label>
                <input type="text" th:field="*{username}" required class="input"/>
            </div>
            <div>
                <label class="block text-xs text-slate-500 mb-1">Full Name</label>
                <input type="text" th:field="*{fullName}" required class="input"/>
            </div>
            <div>
                <label class="block text-xs text-slate-500 mb-1">Email</label>
                <input type="email" th:field="*{email}" class="input"/>
            </div>
            <div>
                <label class="block text-xs text-slate-500 mb-1">Phone</label>
                <input type="text" th:field="*{phone}" class="input"/>
            </div>
            <div>
                <label class="block text-xs text-slate-500 mb-1">Team</label>
                <input type="text" th:field="*{team}" class="input"/>
            </div>
            <div>
                <label class="block text-xs text-slate-500 mb-1">Role</label>
                <select th:field="*{roleId}" required class="input">
                    <option value="1">Normal User</option>
                    <option value="2">Supervisor</option>
                    <option value="3">Admin</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-slate-500 mb-1">Initial Password (min 8 chars)</label>
                <div class="relative">
                    <input type="password" th:field="*{rawPassword}" required minlength="8" id="rawPassword-field" class="input pr-10"/>
                    <button type="button" onclick="togglePasswordVisibility('rawPassword-field', this)"
                            class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-slate-600"
                            aria-label="Show password" tabindex="-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 eye-open" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 eye-closed hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="flex gap-3">
                <button type="submit" class="btn-primary">Create User</button>
                <a href="/settings/users" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
