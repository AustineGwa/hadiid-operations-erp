<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Audit trail')}"></head>
<body class="bg-slate-50 min-h-screen">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div class="lg:pl-64">
<div th:replace="~{fragments/layout :: topbar(title='Audit Trail')}"></div>
<main class="max-w-6xl mx-auto p-6">
    <h1 class="text-2xl font-bold text-slate-900 mb-4">Audit Trail</h1>
    <p class="text-sm text-slate-500 mb-4">
        "Who changed what, and why" — separate from the operational stage-history log (Rule 33).
    </p>

    <div class="card overflow-hidden">
        <table class="min-w-full text-sm">
            <thead class="bg-slate-50">
            <tr>
                <th class="th-cell">When</th>
                <th class="th-cell">User</th>
                <th class="th-cell">Action</th>
                <th class="th-cell">Module</th>
                <th class="th-cell">Old</th>
                <th class="th-cell">New</th>
                <th class="th-cell">Reason</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="l : ${logs}" class="border-t">
                <td class="td-cell whitespace-nowrap" th:text="${l.occurredAt}"></td>
                <td class="td-cell" th:text="${l.userFullName}"></td>
                <td class="td-cell" th:text="${l.action}"></td>
                <td class="td-cell" th:text="${l.module}"></td>
                <td class="td-cell" th:text="${l.oldValue}"></td>
                <td class="td-cell" th:text="${l.newValue}"></td>
                <td class="td-cell" th:text="${l.reason}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(logs)}"><td colspan="7" class="px-4 py-6 text-center text-slate-400">No audit entries yet.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</div>
</body>
</html>
