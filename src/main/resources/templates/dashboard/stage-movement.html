<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Stage movement analysis')}"></head>
<body class="bg-slate-50 min-h-screen">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div class="lg:pl-64">
<div th:replace="~{fragments/layout :: topbar(title='Stage Movement Analysis')}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="max-w-7xl mx-auto p-6 space-y-6">
    <p class="text-sm text-slate-500">
        §K — average/max dwell time per stage, and total arrivals per stage, derived from the append-only stage history.
    </p>

    <div class="card p-5">
        <h3 class="font-semibold text-slate-800 mb-4">Average Dwell Time by Originating Stage (days)</h3>
        <canvas id="dwellChart" height="220"></canvas>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
        <div class="card overflow-hidden">
            <div class="px-5 py-3 border-b border-slate-100 font-semibold text-slate-800">Dwell Time Detail</div>
            <table class="min-w-full text-sm">
                <thead class="bg-slate-50">
                <tr>
                    <th class="th-cell">From Stage</th>
                    <th class="th-cell text-right">Avg Days</th>
                    <th class="th-cell text-right">Max Days</th>
                    <th class="th-cell text-right">Moves</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="row : ${dwellStats}">
                    <td class="td-cell font-medium" th:text="${row.fromStageLabel}"></td>
                    <td class="td-cell text-right" th:text="${#numbers.formatDecimal(row.avgDaysHeld,1,2)}"></td>
                    <td class="td-cell text-right" th:text="${row.maxDaysHeld}"></td>
                    <td class="td-cell text-right" th:text="${row.transitionCount}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(dwellStats)}"><td colspan="4" class="td-cell text-center text-slate-400 py-8">No stage history yet.</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card overflow-hidden">
            <div class="px-5 py-3 border-b border-slate-100 font-semibold text-slate-800">Arrivals by Destination Stage</div>
            <table class="min-w-full text-sm">
                <thead class="bg-slate-50">
                <tr><th class="th-cell">To Stage</th><th class="th-cell text-right">Arrivals</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="row : ${arrivals}">
                    <td class="td-cell" th:text="${row.toStageLabel}"></td>
                    <td class="td-cell text-right font-semibold" th:text="${row.arrivalCount}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const dwellStats = /*[[${dwellStats}]]*/ [];
    /*]]>*/
    new Chart(document.getElementById('dwellChart'), {
        type: 'bar',
        data: {
            labels: dwellStats.map(r => r.fromStageLabel),
            datasets: [{ label: 'Avg Days Held', data: dwellStats.map(r => r.avgDaysHeld), backgroundColor: '#2563eb', borderRadius: 4 }]
        },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
    });
</script>
</body>
</html>
