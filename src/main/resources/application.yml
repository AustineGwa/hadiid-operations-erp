spring:
  application:
    name: hadiid-erp
  profiles:
    active: h2   # switch to "mysql" for real deployment (see application-mysql.yml)
  thymeleaf:
    cache: false
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

logging:
  level:
    com.hadiid.erp: INFO
    org.flywaydb: INFO

hadiid:
  security:
    remember-me-key: "hadiid-erp-change-me"

---
# H2 profile (default, active above) — in-memory, MySQL compatibility mode, so this
# sandbox/dev profile can build+boot without a real MySQL server. Not used for
# real deployment; see application-mysql.yml for that. DB_CLOSE_DELAY=-1 keeps the
# in-memory database alive for the life of the JVM (otherwise it would be dropped
# the instant the first connection closes, which happens between Flyway and the app).
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: "jdbc:h2:mem:hadiid_erp;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
